name: Enterprise CI/CD

on:
  workflow_dispatch:
    inputs:
      track:
        description: "Deployment track"
        required: true
        default: "dev"
        type: choice
        options:
          - dev
          - stg
  push:
    # Intentionally *not* main: avoid accidentally deploying whatever is on main until branches are in place.
    branches:
      - dev
      - stg

permissions:
  contents: read
  actions: write

concurrency:
  group: enterprise-cicd-v2-${{ github.event_name == 'workflow_dispatch' && inputs.track || github.ref_name }}
  cancel-in-progress: true

env:
  AWS_REGION: us-east-1
  AWS_DEFAULT_REGION: us-east-1
  ASSETS_ROOT: assets
  CARGO_TARGET_DIR: ${{ github.workspace }}/target

jobs:
  runner_check:
    name: Check mud self-hosted runner availability
    runs-on: ubuntu-latest
    outputs:
      runner_name: ${{ steps.find_runner.outputs.runner_name }}
      runner_count: ${{ steps.find_runner.outputs.runner_count }}

    steps:
      - name: Cancel older same-branch workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          CURRENT_RUN_NUMBER: ${{ github.run_number }}
          WORKFLOW_NAME: ${{ github.workflow }}
          BRANCH_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if ! runs_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH_NAME}&per_page=50")"; then
            echo "::warning::Unable to list older workflow runs for stale-run cleanup."
            exit 0
          fi

          while IFS= read -r run_id; do
            [ -n "$run_id" ] || continue
            echo "::notice::cancelling_older_workflow_run=${run_id}"
            gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" >/dev/null \
              || echo "::warning::Unable to cancel older workflow run ${run_id}."
            sleep 2
            run_status="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.status' || true)"
            if [ "$run_status" != "completed" ]; then
              echo "::notice::force_cancelling_older_workflow_run=${run_id}"
              gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" >/dev/null \
                || echo "::warning::Unable to force-cancel older workflow run ${run_id}."
            fi
          done < <(
            printf "%s" "$runs_json" | jq -r \
              --arg workflow "$WORKFLOW_NAME" \
              --argjson current_run_id "$CURRENT_RUN_ID" \
              --argjson current_run_number "$CURRENT_RUN_NUMBER" '
                .workflow_runs[]
                | select(.name == $workflow)
                | select(.id != $current_run_id)
                | select(.run_number < $current_run_number)
                | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "requested" or .status == "pending")
                | .id
              '
          )

      - name: Find available mud runner
        id: find_runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! runner_snapshot="$(
            gh api repos/${{ github.repository }}/actions/runners --paginate \
              --jq '.runners | map({name: .name, status: .status, busy: .busy, labels: (.labels | map(.name)})'
          )"; then
            echo "::warning::Runner inventory check is unavailable for the CI token; allowing self-hosted scheduling to proceed."
            echo "runner_name=deferred" >> "$GITHUB_OUTPUT"
            # Let downstream self-hosted jobs attempt normal label-based scheduling.
            # This avoids false skips when GITHUB_TOKEN cannot read runner inventory.
            echo "runner_count=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runner_names="$(
            printf "%s" "$runner_snapshot" | jq -r '
              map(
                select(
                  .status=="online" and
                  (.labels | index("self-hosted")) != null and
                  (.labels | index("Linux")) != null and
                  (.labels | index("mud")) != null
                )
              )
              | map(.name)
              | sort
              | unique
              | join(",")
            '
          )"
          runner_count="$(printf "%s" "$runner_names" | awk -F',' '{print (NF==1 && $1=="" ? 0 : NF)}')"

          if [ "$runner_count" -eq 0 ]; then
            echo "::error::No online self-hosted runner matching labels [self-hosted, Linux, mud] was found."
            echo "Registered runners:"
            printf "%s" "$runner_snapshot" | jq -r 'map("\(.name): status=\(.status) busy=\(.busy) labels=\(.labels | join(\",\"))") | join("\n")'
            exit 1
          fi

          echo "runner_name=$runner_names" >> "$GITHUB_OUTPUT"
          echo "runner_count=$runner_count" >> "$GITHUB_OUTPUT"
          echo "::notice::Using mud runner(s): $runner_names"

  build:
    name: Build + Store Asset
    needs: runner_check
    if: fromJSON(needs.runner_check.outputs.runner_count) > 0
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 60

    outputs:
      track: ${{ steps.meta.outputs.track }}
      deploy_env: ${{ steps.meta.outputs.deploy_env }}
      sha: ${{ steps.meta.outputs.sha }}
      artifact_path: ${{ steps.build_asset.outputs.artifact_path }}
      bucket: ${{ steps.s3.outputs.bucket }}
      key: ${{ steps.s3.outputs.key }}
      asset_ready_epoch: ${{ steps.s3.outputs.asset_ready_epoch }}
      e2e_core: ${{ steps.scope.outputs.run_e2e_core }}
      e2e_ws: ${{ steps.scope.outputs.run_e2e_ws }}
      e2e_scope_reason: ${{ steps.scope.outputs.scope_reason }}
      e2e_scope_count: ${{ steps.scope.outputs.changed_count }}
      e2e_scope_files: ${{ steps.scope.outputs.changed_files }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Keep build output/cargo target dirs on the runner for speed.
          fetch-depth: 2
          clean: false

      - name: Meta
        id: meta
        shell: bash
        run: |
          set -euo pipefail

          sha="${GITHUB_SHA}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            track="${{ inputs.track }}"
          else
            track="${GITHUB_REF_NAME}"
          fi

          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "track=$track" >> "$GITHUB_OUTPUT"

          case "$track" in
            dev) deploy_env="dev" ;;
            stg) deploy_env="stg" ;;
            *) echo "unknown track: $track" >&2; exit 2 ;;
          esac
          echo "deploy_env=$deploy_env" >> "$GITHUB_OUTPUT"

      - name: Preflight disk hygiene
        shell: bash
        run: |
          set -euo pipefail
          echo "Disk before cleanup"
          df -h /

          if [[ "${GITHUB_REF_NAME}" == "dev" ]]; then
            echo "Dev branch: keeping workspace and target caches for warm builds."
          else
            avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
            if [ "${avail_kb}" -lt 1572864 ]; then
              echo "Disk pressure detected; pruning local target caches to preserve stability."
              rm -rf "$GITHUB_WORKSPACE/target"
              rm -rf /opt/actions-runner/_work/slopmud/slopmud/target
            else
              echo "Keeping local cargo target directories for warm-cache compile speed."
            fi
          fi
          find /opt/actions-runner/_diag -type f -name '*.log' -mtime +7 -delete || true

          avail_kb="$(df -Pk / | awk 'NR==2 {print $4}')"
          if [ "${avail_kb}" -lt 1048576 ]; then
            echo "insufficient free space on / (available ${avail_kb} KB)" >&2
            echo "manual cleanup required on the runner host before retrying" >&2
            exit 2
          fi

          echo "Disk after cleanup"
          df -h /

      - name: Assert Runner Build Deps
        shell: bash
        run: |
          set -euo pipefail
          for c in gcc git jq make pkg-config just python3 tar; do
            command -v "$c" >/dev/null 2>&1 || {
              echo "missing build dependency: $c" >&2
              echo "bootstrap the runner once (as admin on the host) using scripts/cicd/bootstrap_runner.sh" >&2
              exit 2
            }
          done

          # Only required for the S3 artifact path; dev track can fall back to local artifacts.
          command -v aws >/dev/null 2>&1 || {
            echo "WARN: aws CLI is missing; S3 upload will fail (dev continues, stg/prod requires aws)" >&2
          }

      - name: Rust Toolchain On PATH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.cargo/env" ]]; then
            # shellcheck disable=SC1090
            source "$HOME/.cargo/env"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          tool_bin="$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
          if [[ -d "$tool_bin" ]]; then
            mkdir -p "$HOME/.cargo/bin"
            for c in cargo rustc rustfmt cargo-fmt cargo-clippy clippy-driver rustdoc; do
              if [[ -x "$tool_bin/$c" ]]; then
                ln -sf "$tool_bin/$c" "$HOME/.cargo/bin/$c"
              fi
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version
          rustc --version

      - name: Scope E2E Targets
        id: scope
        env:
          TRACK: ${{ steps.meta.outputs.deploy_env }}
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/cicd/ci_scope_e2e.sh

      - name: Detect local Rust cache
        id: local_rust_cache
        shell: bash
        run: |
          set -euo pipefail
          target_present=0
          cargo_present=0

          if [[ -d target/debug/.fingerprint || -d target/devdeploy/.fingerprint || -d target/release/.fingerprint ]]; then
            target_present=1
          fi
          if [[ -d "${CARGO_HOME:-$HOME/.cargo}/registry/src" || -d "${CARGO_HOME:-$HOME/.cargo}/git/checkouts" ]]; then
            cargo_present=1
          fi

          if [[ "$target_present" == "1" && "$cargo_present" == "1" ]]; then
            present=1
          else
            present=0
          fi

          echo "present=$present" >> "$GITHUB_OUTPUT"
          echo "::notice::local_rust_cache_present=${present} target=${target_present} cargo=${cargo_present}"

      - name: Restore Rust cache
        if: steps.local_rust_cache.outputs.present != '1'
        uses: Swatinem/rust-cache@v2

      - name: Validate (fast + strict)
        id: validate
        shell: bash
        env:
          DEPLOY_ENV: ${{ steps.meta.outputs.deploy_env }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          just fmt-check
          just py-check

          # dev: the artifact build is the compile gate; avoid paying for a
          # separate cold cargo check before building the same deployable bins.
          if [[ "$DEPLOY_ENV" == "dev" ]]; then
            echo "::notice::dev_validate_compile_deferred_to_build_asset=1"
          else
            RUSTFLAGS="-D warnings" cargo build --workspace --all-targets
            RUSTFLAGS="-D warnings" cargo test
            just world-validate
            just proto-lint
          fi
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::validate_duration_s=${duration_s}"
          echo "duration_s=${duration_s}" >> "$GITHUB_OUTPUT"

      - name: Build Asset (non-cleanroom)
        id: build_asset
        shell: bash
        env:
          TRACK: ${{ steps.meta.outputs.deploy_env }}
          # Clean rebuild only on the stg branch/track.
          CLEAN_BUILD: ${{ steps.meta.outputs.deploy_env == 'stg' && '1' || '0' }}
          # Dev deploys the game broker + split Raft trio. Keep web/OIDC out of
          # the hot branch path, but include adminctl/WAL helpers because the
          # trio restore/backup path needs them during node replacement.
          BUILD_STATIC_WEB: ${{ steps.meta.outputs.deploy_env == 'dev' && '0' || '1' }}
          BUILD_SLOPMUD_WEB: ${{ steps.meta.outputs.deploy_env == 'dev' && '0' || '1' }}
          BUILD_INTERNAL_OIDC: ${{ steps.meta.outputs.deploy_env == 'dev' && '0' || '1' }}
          BUILD_SLOPMUD_ADMINCTL: "1"
          BUILD_WALBACKUPD: "1"
          # The mud runner is intentionally tiny; keep release builds single-job.
          SLOPMUD_CARGO_BUILD_JOBS: "1"
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"

          heartbeat_pid=""
          cleanup_heartbeat() {
            if [[ -n "${heartbeat_pid}" ]]; then
              kill "${heartbeat_pid}" 2>/dev/null || true
              wait "${heartbeat_pid}" 2>/dev/null || true
            fi
          }
          trap cleanup_heartbeat EXIT
          (
            while true; do
              sleep 60
              echo "::notice::build_asset_heartbeat $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            done
          ) &
          heartbeat_pid="$!"

          artifact_path="$(./scripts/cicd/build_assets.sh)"
          cleanup_heartbeat
          trap - EXIT

          echo "artifact_path=$artifact_path" >> "$GITHUB_OUTPUT"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::build_asset_duration_s=${duration_s}"
          echo "duration_s=${duration_s}" >> "$GITHUB_OUTPUT"

      - name: Upload To S3
        id: s3
        shell: bash
        env:
          TRACK: ${{ steps.meta.outputs.deploy_env }}
          SHA: ${{ steps.meta.outputs.sha }}
          ARTIFACT_PATH: ${{ steps.build_asset.outputs.artifact_path }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          bucket=""
          key=""

          if command -v aws >/dev/null 2>&1; then
            account_id="$(aws sts get-caller-identity --query Account --output text)"
            bucket="slopmud-assets-${account_id}-${AWS_REGION}"
            key="${TRACK}/${SHA}/artifact.tgz"

            set +e
            aws s3 cp "$ARTIFACT_PATH" "s3://${bucket}/${key}"
            rc=$?
            set -e
            if [[ $rc -ne 0 ]]; then
              if [[ "$TRACK" == "dev" ]]; then
                echo "WARN: S3 upload failed (dev track continues without S3). Apply terraform to create/permit the assets bucket." >&2
                bucket=""
                key=""
              else
                exit $rc
              fi
            fi
          else
            if [[ "$TRACK" == "dev" ]]; then
              echo "WARN: aws CLI is missing; dev track continues with the local artifact." >&2
            else
              echo "ERROR: aws CLI is required for ${TRACK} artifact upload." >&2
              exit 2
            fi
          fi

          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          asset_ready_epoch="$(date +%s)"
          echo "asset_ready_epoch=$asset_ready_epoch" >> "$GITHUB_OUTPUT"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::s3_upload_duration_s=${duration_s}"
          echo "duration_s=${duration_s}" >> "$GITHUB_OUTPUT"

  deploy_sandbox:
    name: Deploy to sandbox (pre-dev smoke)
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 20
    needs: build
    if: needs.build.outputs.deploy_env == 'dev'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Sync local deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/cicd/slopmud-shuttle-assets
          chmod +x scripts/cicd/deploy_split_raft_trio_from_asset.sh

      - name: Assert Deploy Hook Installed
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/bin/slopmud-shuttle-assets --help >/dev/null 2>&1

      - name: Deploy to sandbox
        id: deploy
        shell: bash
        env:
          ARTIFACT_PATH: ${{ needs.build.outputs.artifact_path }}
          BUCKET: ${{ needs.build.outputs.bucket }}
          KEY: ${{ needs.build.outputs.key }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"

          if [[ -f "$ARTIFACT_PATH" ]]; then
            sudo -n /usr/local/bin/slopmud-shuttle-assets \
              --env sandbox \
              --from-file "$ARTIFACT_PATH"
          elif [[ -n "${BUCKET}" && -n "${KEY}" ]]; then
            sudo -n /usr/local/bin/slopmud-shuttle-assets \
              --env sandbox \
              --from-s3 "s3://${BUCKET}/${KEY}"
          else
            sudo -n /usr/local/bin/slopmud-shuttle-assets \
              --env sandbox \
              --from-file "$ARTIFACT_PATH"
          fi
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::sandbox_deploy_duration_s=${duration_s}"
          echo "duration_s=${duration_s}" >> "$GITHUB_OUTPUT"

      - name: Smoke Test
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          python3 ./scripts/cicd/smoke_telnet.py --host 127.0.0.1 --port 4500
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::sandbox_smoke_duration_s=${duration_s}"

  e2e-core-local:
    name: E2E (core local, fast)
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 25
    needs: [build, deploy_sandbox]
    if: >
      needs.build.outputs.deploy_env == 'dev' &&
      needs.build.outputs.e2e_core == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rust Toolchain On PATH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.cargo/env" ]]; then
            # shellcheck disable=SC1090
            source "$HOME/.cargo/env"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          tool_bin="$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
          if [[ -d "$tool_bin" ]]; then
            mkdir -p "$HOME/.cargo/bin"
            for c in cargo rustc rustfmt cargo-fmt cargo-clippy clippy-driver rustdoc; do
              if [[ -x "$tool_bin/$c" ]]; then
                ln -sf "$tool_bin/$c" "$HOME/.cargo/bin/$c"
              fi
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version

      - name: Run e2e-local (skip-build)
        id: run
        shell: bash
        env:
          SLOPMUD_E2E_BIN_DIR: target/devdeploy
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          python3 scripts/e2e_local.py --skip-build --bin-dir "$SLOPMUD_E2E_BIN_DIR"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::e2e_local_duration_s=${duration_s}"

  e2e-core-party:
    name: E2E (core party, fast)
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 25
    needs: [build, deploy_sandbox]
    if: >
      needs.build.outputs.deploy_env == 'dev' &&
      needs.build.outputs.e2e_core == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rust Toolchain On PATH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.cargo/env" ]]; then
            # shellcheck disable=SC1090
            source "$HOME/.cargo/env"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          tool_bin="$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
          if [[ -d "$tool_bin" ]]; then
            mkdir -p "$HOME/.cargo/bin"
            for c in cargo rustc rustfmt cargo-fmt cargo-clippy clippy-driver rustdoc; do
              if [[ -x "$tool_bin/$c" ]]; then
                ln -sf "$tool_bin/$c" "$HOME/.cargo/bin/$c"
              fi
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version

      - name: Run e2e-party (skip-build)
        id: run
        shell: bash
        env:
          SLOPMUD_E2E_BIN_DIR: target/devdeploy
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          python3 scripts/e2e_party_run.py --skip-build --bin-dir "$SLOPMUD_E2E_BIN_DIR"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::e2e_party_duration_s=${duration_s}"

  e2e-ws:
    name: E2E (ws gateway)
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 25
    needs: [build, deploy_sandbox]
    if: >
      needs.build.outputs.deploy_env == 'dev' &&
      needs.build.outputs.e2e_ws == '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Rust Toolchain On PATH
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$HOME/.cargo/env" ]]; then
            # shellcheck disable=SC1090
            source "$HOME/.cargo/env"
          else
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          tool_bin="$HOME/.rustup/toolchains/stable-x86_64-unknown-linux-gnu/bin"
          if [[ -d "$tool_bin" ]]; then
            mkdir -p "$HOME/.cargo/bin"
            for c in cargo rustc rustfmt cargo-fmt cargo-clippy clippy-driver rustdoc; do
              if [[ -x "$tool_bin/$c" ]]; then
                ln -sf "$tool_bin/$c" "$HOME/.cargo/bin/$c"
              fi
            done
          fi
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          cargo --version

      - name: Build and run ws e2e
        id: run
        shell: bash
        env:
          SLOPMUD_E2E_BIN_DIR: target/devdeploy
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          cargo build -q --profile devdeploy -p shard_01 -p ws_gateway -p bot_party --bins
          ./target/devdeploy/e2e_ws
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::e2e_ws_duration_s=${duration_s}"

  deploy:
    name: Deploy To ${{ needs.build.outputs.deploy_env }}
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 20
    needs: [build, deploy_sandbox, e2e-core-local, e2e-core-party, e2e-ws]
    if: |
      always() &&
      needs.build.result == 'success' &&
      (
        needs.build.outputs.deploy_env == 'stg' ||
        (
          needs.build.outputs.deploy_env == 'dev' &&
          needs.deploy_sandbox.result == 'success' &&
          (needs.e2e-core-local.result == 'success' || needs.e2e-core-local.result == 'skipped') &&
          (needs.e2e-core-party.result == 'success' || needs.e2e-core-party.result == 'skipped') &&
          (needs.e2e-ws.result == 'success' || needs.e2e-ws.result == 'skipped')
        )
      )

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Sync local deploy helpers
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/cicd/slopmud-shuttle-assets
          chmod +x scripts/cicd/deploy_split_raft_trio_from_asset.sh

      - name: Assert Deploy Hook Installed
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/bin/slopmud-shuttle-assets --help >/dev/null 2>&1

      - name: Deploy
        id: deploy
        shell: bash
        env:
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
          ARTIFACT_PATH: ${{ needs.build.outputs.artifact_path }}
          BUCKET: ${{ needs.build.outputs.bucket }}
          KEY: ${{ needs.build.outputs.key }}
          SLOPMUD_DEV_RAFT_ENV_FILE: ${{ vars.SLOPMUD_DEV_RAFT_ENV_FILE }}
          SLOPMUD_DEV_RAFT_TERRAFORM_DIR: ${{ vars.SLOPMUD_DEV_RAFT_TERRAFORM_DIR }}
          SLOPMUD_DEV_RAFT_FAST_RESTART_BUDGET_MS: ${{ vars.SLOPMUD_DEV_RAFT_FAST_RESTART_BUDGET_MS }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          artifact_ref="$ARTIFACT_PATH"
          if [[ -n "${BUCKET}" && -n "${KEY}" ]]; then
            artifact_ref="s3://${BUCKET}/${KEY}"
          fi

          if [[ "$DEPLOY_ENV" == "dev" ]]; then
            env_file="${SLOPMUD_DEV_RAFT_ENV_FILE:-}"
            if [[ -z "$env_file" ]]; then
              for candidate in env/dev-split.env /home/rob/slopmud/env/dev-split.env; do
                if [[ -f "$candidate" ]]; then
                  env_file="$candidate"
                  break
                fi
              done
            fi
            if [[ ! -f "$env_file" ]]; then
              echo "ERROR: dev split Raft env file not found" >&2
              echo "Set SLOPMUD_DEV_RAFT_ENV_FILE or provision env/dev-split.env on the self-hosted runner." >&2
              exit 2
            fi
            tf_dir="${SLOPMUD_DEV_RAFT_TERRAFORM_DIR:-infra/terraform/single-az-raft-us-east-1}"
            if [[ -d "$tf_dir" ]]; then
              tf_account_id="$(aws sts get-caller-identity --query Account --output text)"
              tf_backend_bucket="${SLOPMUD_TFSTATE_BUCKET:-tfstate-${tf_account_id}-${AWS_REGION}-slopmud}"
              tf_backend_key="${SLOPMUD_DEV_RAFT_TFSTATE_KEY:-single-az-raft-us-east-1/terraform.tfstate}"
              terraform -chdir="$tf_dir" init -input=false -reconfigure \
                -backend-config="bucket=${tf_backend_bucket}" \
                -backend-config="key=${tf_backend_key}" \
                -backend-config="region=${AWS_REGION}"
              ./scripts/cicd/reconcile_raft_dns.sh --terraform-dir "$tf_dir"
            fi
            export SLOPMUD_FAST_ROLLING_RESTART="${SLOPMUD_FAST_ROLLING_RESTART:-1}"
            export SLOPMUD_ROLLING_RESTART_BUDGET_MS="${SLOPMUD_DEV_RAFT_FAST_RESTART_BUDGET_MS:-${SLOPMUD_ROLLING_RESTART_BUDGET_MS:-15000}}"
            export SLOPMUD_STRICT_LIVE_UPGRADE="${SLOPMUD_STRICT_LIVE_UPGRADE:-1}"
            ./scripts/cicd/deploy_split_raft_trio_from_asset.sh "$env_file" "$artifact_ref"
          elif [[ -n "${BUCKET}" && -n "${KEY}" ]]; then
            sudo -n /usr/local/bin/slopmud-shuttle-assets \
              --env "$DEPLOY_ENV" \
              --from-s3 "s3://${BUCKET}/${KEY}"
          else
            sudo -n /usr/local/bin/slopmud-shuttle-assets \
              --env "$DEPLOY_ENV" \
              --from-file "$ARTIFACT_PATH"
          fi
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::deploy_duration_s=${duration_s}"

      - name: Smoke Test
        id: smoke
        shell: bash
        env:
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
          ASSET_READY_EPOCH: ${{ needs.build.outputs.asset_ready_epoch }}
          SLOPMUD_PUBLIC_SMOKE_HOST: ${{ vars.SLOPMUD_PUBLIC_SMOKE_HOST }}
          SLOPMUD_PUBLIC_SMOKE_PORT: ${{ vars.SLOPMUD_PUBLIC_SMOKE_PORT }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"

          case "$DEPLOY_ENV" in
            dev) port="4000" ;;
            stg) port="4023" ;;
            *) echo "unknown deploy env: $DEPLOY_ENV" >&2; exit 2 ;;
          esac

          python3 ./scripts/cicd/smoke_telnet.py --host 127.0.0.1 --port "$port"

          if [[ "$DEPLOY_ENV" == "dev" ]]; then
            public_host="${SLOPMUD_PUBLIC_SMOKE_HOST:-dev-mud.slopmud.com}"
            public_port="${SLOPMUD_PUBLIC_SMOKE_PORT:-4000}"
            python3 ./scripts/cicd/smoke_telnet.py --host "$public_host" --port "$public_port" --timeout-s 10
            echo "::notice::deploy_public_smoke=${public_host}:${public_port}"
            if [[ "${ASSET_READY_EPOCH:-}" =~ ^[0-9]+$ ]]; then
              public_smoke_after_asset_ready_s=$(( $(date +%s) - ASSET_READY_EPOCH ))
              echo "::notice::deploy_public_smoke_after_asset_ready_s=${public_smoke_after_asset_ready_s}"
            fi
          fi

          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::deploy_smoke_duration_s=${duration_s}"

  promote_prod:
    name: Promote To Prod
    runs-on: [self-hosted, Linux, mud]
    timeout-minutes: 30
    needs: [build, deploy]
    if: needs.build.outputs.deploy_env == 'stg'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Sync local shuttle helper
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/cicd/slopmud-shuttle-assets

      - name: Assert Deploy Hook Installed
        shell: bash
        run: |
          set -euo pipefail
          sudo -n /usr/local/bin/slopmud-shuttle-assets --help >/dev/null 2>&1

      - name: Copy STG Asset -> prod/
        id: copy
        shell: bash
        env:
          BUCKET: ${{ needs.build.outputs.bucket }}
          SHA: ${{ needs.build.outputs.sha }}
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          aws s3 cp \
            "s3://${BUCKET}/${DEPLOY_ENV}/${SHA}/artifact.tgz" \
            "s3://${BUCKET}/prod/${SHA}/artifact.tgz"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::promote_copy_duration_s=${duration_s}"

      - name: Store Local Prod Asset (No Rebuild)
        id: sync
        shell: bash
        env:
          BUCKET: ${{ needs.build.outputs.bucket }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          mkdir -p "assets/prod/${SHA}"
          aws s3 cp "s3://${BUCKET}/prod/${SHA}/artifact.tgz" "assets/prod/${SHA}/artifact.tgz"
          tar -xzf "assets/prod/${SHA}/artifact.tgz" -C "assets/prod/${SHA}" BUILD_INFO.txt 2>/dev/null || true
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::promote_sync_duration_s=${duration_s}"

      - name: Deploy Prod
        id: deploy
        shell: bash
        env:
          BUCKET: ${{ needs.build.outputs.bucket }}
          SHA: ${{ needs.build.outputs.sha }}
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          sudo -n /usr/local/bin/slopmud-shuttle-assets \
            --env prd \
            --from-s3 "s3://${BUCKET}/prod/${SHA}/artifact.tgz"
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::promote_deploy_duration_s=${duration_s}"

      - name: Smoke Test (Prod)
        id: smoke
        shell: bash
        run: |
          set -euo pipefail
          start_ts="$(date +%s)"
          python3 ./scripts/cicd/smoke_telnet.py --host 127.0.0.1 --port 4200
          duration_s=$(( $(date +%s) - start_ts ))
          echo "::notice::promote_smoke_duration_s=${duration_s}"
