name: Deploy Gateway Status

on:
  workflow_dispatch:
  push:
    branches:
      - agent/**status-gateway

permissions:
  contents: read

concurrency:
  group: deploy-gateway-status
  cancel-in-progress: true

jobs:
  deploy:
    name: Install slopmud_statusd on gateway
    runs-on: [self-hosted, Linux]
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          clean: false

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p slopmud_statusd --release

      - name: Install
        shell: bash
        run: |
          set -euo pipefail
          sudo install -m 0755 target/release/slopmud_statusd /usr/local/bin/slopmud_statusd
          sudo tee /etc/systemd/system/slopmud-statusd.service >/dev/null <<'UNIT'
          [Unit]
          Description=Slopmud public status dashboard
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User=slopmud
          Group=slopmud
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true
          Environment=SLOPMUD_STATUS_BIND=0.0.0.0:80
          Environment=SLOPMUD_STATUS_TITLE=Slopmud Status
          Environment=SLOPMUD_STATUS_ENVS=dev,stg,prd
          Environment="SLOPMUD_STATUS_CHECKS=dev telnet=tcp://127.0.0.1:4000,prod telnet=tcp://127.0.0.1:4200,websocket=tcp://127.0.0.1:4242,metrics=tcp://127.0.0.1:9912"
          ExecStart=/usr/local/bin/slopmud_statusd
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          UNIT

          sudo systemctl daemon-reload
          sudo systemctl enable --now slopmud-statusd
          sudo systemctl restart slopmud-statusd
          sleep 1
          sudo systemctl --no-pager --full status slopmud-statusd
          curl -fsS http://127.0.0.1/healthz
          curl -fsS http://127.0.0.1/api/status
